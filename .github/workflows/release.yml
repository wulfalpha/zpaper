name: Release

# Push a tag matching the version in build.zig.zon, e.g.:
#   git tag v0.8.0 && git push origin v0.8.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check tag matches build.zig.zon version
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.zig.zon version $version" >&2
            exit 1
          fi
          readme_version=$(sed -n 's/^version=//p' README.md)
          if [ "$readme_version" != "$version" ]; then
            echo "README install version $readme_version does not match $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: zig build test

      # Target glibc 2.31 so the binary runs on older distributions too
      # (Debian 11+, Ubuntu 20.04+, Raspberry Pi OS bullseye+).
      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.arch }}-linux-gnu.2.31

      - name: Integration tests against the release binary
        run: python3 tests/integration.py

      - name: Package
        run: |
          name="zpaper-${VERSION}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name/contrib"
          cp zig-out/bin/zpaper README.md LICENSE CHANGELOG.md zpaperc.example "dist/$name/"
          cp -r contrib/zpaper.service contrib/zpaper-pick contrib/two-monitors.zpaperc contrib/completions "dist/$name/contrib/"
          tar -C dist -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: zpaper-${{ matrix.arch }}
          path: zpaper-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum zpaper-*.tar.gz > SHA256SUMS

      # Release notes are the matching CHANGELOG.md section.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/zpaper-*.tar.gz dist/SHA256SUMS \
            --title "zpaper ${GITHUB_REF_NAME#v}" --notes-file notes.md
